# The Sunday job. ADR 0002 is the design; this is the wiring.
#
# THREE CLOCKS, ONE JOB, ONE SCRIPT.
#
#   1. PRIMARY   n8n on the Hostinger VPS, Sunday 06:00 America/New_York, posting
#                to this workflow's dispatch endpoint with trigger=n8n.
#                ops/n8n/sunday-dispatch.json is the workflow, ready to import.
#   2. THIRD     the `schedule:` block below, deliberately early. GitHub's own
#      STRING    scheduled event drifts 35-216 minutes and DROPS about 5% of
#                high-frequency runs (ADR 0002 has the measurements), so it is
#                here to catch "the VPS is down", and for nothing else.
#   3. FALLBACK  a systemd timer on the VPS at 08:30 ET running the identical
#                ops/bin/weekly.sh. Units and runbook in ops/systemd/.
#
# NOTHING BELOW CAN FIRE ON ITS OWN. `cfbpoll guard` reads ops/arming.toml out of
# the checkout, every trigger in it is committed `false`, and a disarmed trigger
# makes every subsequent step a no-op that exits 0. A human clicking "Run
# workflow" is never refused, because a person is not a clock.
#
# So the `schedule:` block IS live rather than commented out, on purpose: a
# commented-out cron proves nothing, and this way the third string's real
# behaviour - including whether GitHub fires it at all across a seven-month
# offseason - is observable in the Actions tab from today, at the cost of one
# forty-second no-op a week.
#
# WHY THE JOB IS A SHELL SCRIPT AND NOT A LIST OF STEPS. ADR 0002's fallback is
# "the identical job ... no second implementation", and a workflow whose steps
# are transcribed into a systemd unit is two implementations that have to agree
# forever. ops/bin/weekly.sh is the job. This file supplies the runner, the
# secrets and the cache.
#
# NO R2. John's ruling of 2026-08-17 removed the Cloudflare leg
# (docs/adr/0015-cfbd-archive-no-r2.md). The private CFBD archive stays on the
# VPS disk with a synced copy on the Mac, so there is no `archive push` step here
# and no R2 secret is referenced anywhere in this repository.

name: weekly

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (blank = derived from the date)"
        required: false
        type: string
      week:
        description: "Week (blank = resolve from CFBD /calendar; needs the key)"
        required: false
        type: string
      publish:
        description: "Publish, or fit and stop"
        required: false
        type: boolean
        default: false
      trigger:
        description: "Who is dispatching. n8n sets this; a human leaves it alone."
        required: false
        type: choice
        default: manual
        options: [manual, n8n]

  # THE THIRD STRING. 08:43 UTC is the expression ADR 0002 wrote down, and the
  # month list is the season: August through December, plus January for the
  # bowls and the playoff. Early on purpose - with the measured 35-216 minute
  # drift, a nominal 04:43 ET start lands in the 05:18-08:19 ET window, which is
  # around and after the 06:00 ET primary rather than hours ahead of it.
  #
  # Note the trap this cannot solve: a public repository's scheduled workflows
  # are auto-disabled after 60 days with no repository activity, and the
  # offseason is seven months. That is precisely why this is the third string and
  # not the clock.
  schedule:
    - cron: "43 8 * 8-12,1 SUN"

permissions:
  contents: write        # the release asset for the week

concurrency:
  group: weekly
  cancel-in-progress: false          # never cancel a half-written publication

jobs:
  rank:
    # Pinned, NOT ubuntu-latest: the alias moves and the reproducibility claim
    # cannot survive that.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Determinism, not performance: multi-threaded reductions sum in a
      # nondeterministic order and the replay job asserts byte-equality.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      # A scheduled run is a scheduled run whatever an input says; a dispatch
      # carries whatever the dispatcher claimed, defaulting to a human.
      TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || (inputs.trigger || 'manual') }}
      SEASON: ${{ inputs.season }}
      WEEK: ${{ inputs.week }}
      PUBLISH: ${{ inputs.publish || false }}
      # The runner has the code but not the published tree: the site's fixture
      # directory lives in a different repository. So CI publishes into the
      # workspace and uploads it. WHO COPIES out/data INTO THE SITE IS AN OPEN
      # DECISION - see docs/runbooks/sunday-automation.md, "The delivery gap".
      FIXTURES: out/data
      OUT: out
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync the locked environment (fails if uv.lock is stale)
        run: uv sync --locked

      # Runs before the archive restore so a disarmed Sunday costs forty seconds
      # rather than a 0.55 GB download. Its outputs are read by every step below.
      - name: Guard - armed trigger, unpublished week, or nothing happens
        id: guard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run cfbpoll guard \
            --trigger "$TRIGGER" \
            --season "$SEASON" \
            --week "$WEEK" \
            --fixtures "$FIXTURES"

      - name: Say plainly that nothing will happen
        if: steps.guard.outputs.should_run != 'true'
        run: |
          echo "::notice title=weekly no-op::trigger=$TRIGGER armed=${{ steps.guard.outputs.armed }} already_published=${{ steps.guard.outputs.already_published }} week_source=${{ steps.guard.outputs.week_source }}"
          echo "This is the expected outcome while ops/arming.toml is default-off."

      - name: Restore the MIT archive
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: archive/sportsdataverse
          key: sdv-${{ hashFiles('data/manifests/sportsdataverse.lock.json') }}

      # ONE STEP, because ops/bin/weekly.sh IS the job and the VPS fallback runs
      # this exact file. The guard runs a second time inside it; it is read-only,
      # costs at most one CFBD call, and running it in the script is what keeps
      # the script usable on its own on the VPS.
      #
      # Secrets are absent in a fork by construction (GitHub does not pass them
      # to a workflow triggered from a fork), and every secret-dependent step in
      # the script degrades rather than fails. That single rule is most of what
      # "forkable" means here.
      - name: Run the weekly job
        if: steps.guard.outputs.should_run == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ steps.guard.outputs.season }}
          WEEK: ${{ steps.guard.outputs.week }}
          SKIP_SYNC: "true"
        run: ops/bin/weekly.sh

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.should_run == 'true'
        with:
          name: poll-${{ steps.guard.outputs.season }}-w${{ steps.guard.outputs.week }}
          path: out/
          retention-days: 90
